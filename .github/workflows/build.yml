name: Build FFmpeg

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg version (git tag, e.g., n7.1)'
        required: false
        default: ''

env:
  ANDROID_MIN_SDK: 21
  IOS_MIN_VERSION: '13.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build iOS XCFrameworks (requires macOS)
  build-ios:
    name: Build iOS
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install yasm nasm pkg-config

      - name: Cache FFmpeg source
        uses: actions/cache@v4
        with:
          path: ffmpeg-source/
          key: ffmpeg-src-${{ github.event.inputs.ffmpeg_version || 'latest' }}

      - name: Download FFmpeg source
        run: |
          chmod +x scripts/common/*.sh
          ./scripts/common/download-ffmpeg.sh ${{ github.event.inputs.ffmpeg_version }}

      - name: Build FFmpeg for iOS
        run: |
          chmod +x scripts/ios/*.sh
          ./scripts/ios/build-ios.sh

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-ios-xcframeworks
          path: output/ios/*.xcframework
          retention-days: 30

  # Build macOS frameworks (requires macOS)
  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install yasm nasm pkg-config

      - name: Cache FFmpeg source
        uses: actions/cache@v4
        with:
          path: ffmpeg-source/
          key: ffmpeg-src-${{ github.event.inputs.ffmpeg_version || 'latest' }}

      - name: Download FFmpeg source
        run: |
          chmod +x scripts/common/*.sh
          ./scripts/common/download-ffmpeg.sh ${{ github.event.inputs.ffmpeg_version }}

      - name: Build FFmpeg for macOS
        run: |
          chmod +x scripts/macos/*.sh
          ./scripts/macos/build-macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-frameworks
          path: output/macos/*.framework
          retention-days: 30

  # Build Android shared libraries
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm pkg-config

      - name: Cache FFmpeg source
        uses: actions/cache@v4
        with:
          path: ffmpeg-source/
          key: ffmpeg-src-${{ github.event.inputs.ffmpeg_version || 'latest' }}

      - name: Download FFmpeg source
        run: |
          chmod +x scripts/common/*.sh
          ./scripts/common/download-ffmpeg.sh ${{ github.event.inputs.ffmpeg_version }}

      - name: Build FFmpeg for Android
        run: |
          chmod +x scripts/android/*.sh
          ./scripts/android/build-android.sh

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-libs
          path: output/android/
          retention-days: 30

  # Build Windows native with DXVA2/D3D11VA hardware acceleration
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-yasm
            mingw-w64-x86_64-nasm
            make
            diffutils
            pkg-config
            git

      - name: Cache FFmpeg source
        uses: actions/cache@v4
        with:
          path: ffmpeg-source/
          key: ffmpeg-src-${{ github.event.inputs.ffmpeg_version || 'latest' }}

      - name: Download FFmpeg source
        shell: msys2 {0}
        run: |
          chmod +x scripts/common/*.sh
          ./scripts/common/download-ffmpeg.sh ${{ github.event.inputs.ffmpeg_version }}

      - name: Build FFmpeg for Windows
        shell: msys2 {0}
        run: |
          chmod +x scripts/windows/*.sh
          ./scripts/windows/build-native.sh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-libs
          path: output/windows/
          retention-days: 30

  # Create release when tag is pushed
  release:
    name: Create Release
    needs: [build-ios, build-macos, build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-ios-xcframeworks
          path: ios-xcframeworks

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-android-libs
          path: android-libs

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-macos-frameworks
          path: macos-frameworks

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-windows-libs
          path: windows-libs

      - name: Create archives
        run: |
          cd ios-xcframeworks && zip -r ../ffmpeg-ios-xcframeworks.zip . && cd ..
          cd macos-frameworks && zip -r ../ffmpeg-macos-frameworks.zip . && cd ..
          cd android-libs && zip -r ../ffmpeg-android-libs.zip . && cd ..
          cd windows-libs && zip -r ../ffmpeg-windows-libs.zip . && cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ffmpeg-ios-xcframeworks.zip
            ffmpeg-macos-frameworks.zip
            ffmpeg-android-libs.zip
            ffmpeg-windows-libs.zip
          generate_release_notes: true
